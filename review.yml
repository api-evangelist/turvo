actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Turvo's own API. Turvo's public
    real-time delivery is outbound HTTP webhooks layered on a request/response
    REST API, so no AsyncAPI document was created. Endpoint paths were honestly
    modeled (endpointsModeled: true) because Turvo's interactive reference is
    tenant-gated and could not be fetched anonymously.
