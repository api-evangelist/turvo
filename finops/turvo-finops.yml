description: >-
  FinOps view of Turvo spend. Turvo is sold as an enterprise SaaS
  transportation management system; the Public API and webhooks are a platform
  capability rather than a separately metered, usage-billed product. There is
  no public per-call API price. The dominant, recurring cost is the negotiated
  platform subscription (by edition, seats, modules, and volume). Cost
  optimization for API consumers is therefore about integration efficiency -
  using bulk endpoints and webhooks instead of high-frequency polling, and
  scoping a sandbox tenant for testing - not about shaving per-request fees.
notes: >-
  Turvo does not publish API unit rates; subscription terms are negotiated per
  contract. Verify billing model, included integration/API entitlements, and
  any overage terms directly with Turvo during reconciliation.
