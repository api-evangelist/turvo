meters:
- name: platform_subscription
  description: Negotiated enterprise subscription to the Turvo TMS platform, including API and webhook capability.
  unit: contract
  aggregation: sum
  dimensions:
  - account
  - edition
- name: api_requests
  description: Public API calls made by tenant integrations; not separately metered/billed by Turvo, tracked for efficiency.
  unit: requests
  aggregation: sum
  dimensions:
  - tenant
  - endpoint
- name: webhook_events
  description: Webhook notifications delivered to subscriber endpoints on shipment, order, and tracking changes.
  unit: events
  aggregation: sum
  dimensions:
  - tenant
  - subscription
principles:
- name: Visibility
  description: Track API call volume and webhook subscriptions per integration even though Turvo does not bill per call, to catch inefficient polling.
- name: Allocation
  description: Map the Turvo subscription and integration effort to the teams and workflows (brokerage, shipping, carrier ops) that consume it.
- name: Optimization
  description: Prefer bulk endpoints and webhooks over high-frequency polling; use a sandbox tenant for testing to avoid production churn.
- name: Accountability
  description: Assign an owner for the Turvo integration and review subscription entitlements against actual usage at renewal.
