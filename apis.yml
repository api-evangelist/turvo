aid: turvo
url: https://raw.githubusercontent.com/api-evangelist/turvo/refs/heads/main/apis.yml
name: Turvo
kind: company
description: Turvo is a collaborative cloud transportation management system (TMS)
  that unifies shippers, freight brokers, and carriers on a single real-time
  platform. Its self-service Public API is a JSON REST interface (base
  https://publicapi.turvo.com) secured with OAuth 2.0 plus a per-tenant API key,
  covering shipments, orders, locations, accounts (customers), and carriers, with
  event-driven webhooks for status changes and location updates. API credentials
  and the interactive reference are provisioned per tenant from the API profile
  inside the Turvo application, so the surface is self-serve for Turvo customers
  rather than openly public.
